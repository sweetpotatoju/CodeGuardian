<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeGuardian - AI 코드 분석</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: auto; }
        h1 { color: #3a7; }
        textarea { width: 100%; height: 150px; }
        .result-box { background: #f4f4f4; padding: 10px; margin-top: 15px; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🔍 CodeGuardian - 코드 보안/결함 분석</h1>

    <form id="upload-form">
        <label>Python 파일 업로드:</label><br><br>
        <input type="file" id="file" name="file" accept=".py" required><br><br>
        <button type="submit">분석 요청하기</button>
    </form>

    <div class="result-box" id="result"></div>

    <script>
        const form = document.getElementById("upload-form");
        const resultBox = document.getElementById("result");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            resultBox.textContent = "분석 중입니다...";

            const fileInput = document.getElementById("file");
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch("/analyze", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                resultBox.innerHTML = `
                    <b>🧠 Defect Analysis:</b><br>${data.defect}<br><br>
                    <b>🔐 Security Analysis:</b><br>${data.security}<br><br>
                    <b>🧪 Test Failure Analysis:</b><br>${data.test_failure}
                `;
            } catch (err) {
                resultBox.textContent = "에러 발생: " + err.message;
            }
        });
    </script>
</body>
</html>
